packages:
  - "packages/*"

# Security: transitive dependency pins.
# https://pnpm.io/settings#overrides
overrides:
  yaml: "2.8.3"
  "js-yaml@<3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "browserslist@<4.28.7": "4.28.7"
  "baseline-browser-mapping@<2.11.0": "2.11.0"
  "@humanfs/node@<0.16.8": "0.16.8"
  "micromatch>picomatch": "2.3.2"
  "anymatch>picomatch": "2.3.2"
  "jest-util@29>picomatch": "2.3.2"
  "jest-util@30>picomatch": "4.0.4"
  "brace-expansion@>=1.0.0 <1.1.16": "1.1.16"
  "brace-expansion@>=5.0.0 <5.0.7": "5.0.7"

# 24 hours (1440 minutes); delay before newly published versions may be installed.
minimumReleaseAge: 1440

# https://pnpm.io/settings#verifydepsbeforerun
verifyDepsBeforeRun: error

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1

# https://pnpm.io/settings#blockexoticsubdeps
blockExoticSubdeps: true

# Dependency install scripts: fail install (CI and local) unless the package is allowlisted below.
# https://pnpm.io/settings#strictdepbuilds — errors on unapproved scripts (not just warnings).
strictDepBuilds: true
# https://pnpm.io/settings#allowbuilds
allowBuilds: {}
